name: test-and-package
on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION' >&2; exit 1; }
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$version" ]]; then
            echo 'Tag must equal VERSION (for example 0.3.0).' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  test:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          exit $LASTEXITCODE
      - name: Release build
        shell: pwsh
        run: |
          $targetOS = go env GOOS
          $targetArch = go env GOARCH
          ./scripts/build-release.ps1 -OS $targetOS -Arch $targetArch -OutputDirectory (Join-Path $env:RUNNER_TEMP 'native-build')
      - name: Race test (Unix)
        if: runner.os != 'Windows'
        run: go test -race ./...
  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows, darwin, linux]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and create ZIP
        id: package
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/package-zip.sh "$TARGET_OS" "$TARGET_ARCH" "$RUNNER_TEMP/packages"
          version=$(tr -d '\r\n' < VERSION)
          echo "name=tque-$version-$TARGET_OS-$TARGET_ARCH" >> "$GITHUB_OUTPUT"
      - name: Upload ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ runner.temp }}/packages/${{ steps.package.outputs.name }}.zip
            ${{ runner.temp }}/packages/${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download packages from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tque-${{ needs.metadata.outputs.version }}-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"
